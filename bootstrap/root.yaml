# App-of-apps: o Argo CD gerencia a si mesmo a partir de cluster/ (políticas, produtos).
#   kubectl apply -f bootstrap/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gerffeson-lab/platform-gitops.git
    targetRevision: main
    path: cluster
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: true, selfHeal: true}
