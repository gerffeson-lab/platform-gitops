---
# Source: app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crt-credito-autorizador
  labels:
    app.kubernetes.io/name: crt-credito-autorizador
    app.kubernetes.io/part-of: crt-credito
    app.kubernetes.io/version: "sha-2f13c8c"
    app.kubernetes.io/managed-by: plataforma
    plataforma.acme/sigla: crt
    plataforma.acme/ambiente: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crt-credito-autorizador
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crt-credito-autorizador
        app.kubernetes.io/part-of: crt-credito
        app.kubernetes.io/version: "sha-2f13c8c"
        app.kubernetes.io/managed-by: plataforma
        plataforma.acme/sigla: crt
        plataforma.acme/ambiente: dev
    spec:
      serviceAccountName: crt-credito-autorizador
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "ghcr.io/gerffeson-lab/crt-credito-autorizador:sha-2f13c8c"
          ports:
            - name: http
              containerPort: 8080
          env:
            # identidade e ambiente: padrão OpenTelemetry, igual para qualquer golden path
            - name: OTEL_SERVICE_NAME
              value: crt-credito-autorizador
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=crt-credito,deployment.environment=dev,service.version=sha-2f13c8c"
            - name: SPRING_APPLICATION_NAME
              value: "crt-credito-autorizador"
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
