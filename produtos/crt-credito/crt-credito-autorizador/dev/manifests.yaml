# Manifestos RENDERIZADOS: escritos pela esteira (helm template do chart da plataforma
# + deploy/values-dev.yaml do serviço), nunca à mão. O que está no Git é o que roda.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crt-credito-autorizador
  labels: &labels
    app.kubernetes.io/name: crt-credito-autorizador
    app.kubernetes.io/part-of: crt-credito
    plataforma.acme/sigla: crt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crt-credito-autorizador
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/gerffeson-lab/crt-credito-autorizador:0.1.0-local
          ports:
            - {name: http, containerPort: 8080}
          env:
            # identidade injetada pela plataforma, não escrita pelo dev
            - {name: SPRING_APPLICATION_NAME, value: crt-credito-autorizador}
            - {name: OTEL_SERVICE_NAME, value: crt-credito-autorizador}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=dev,service.namespace=crt-credito"}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: crt-credito-autorizador
  labels:
    app.kubernetes.io/name: crt-credito-autorizador
spec:
  selector:
    app.kubernetes.io/name: crt-credito-autorizador
  ports:
    - {name: http, port: 80, targetPort: http}
